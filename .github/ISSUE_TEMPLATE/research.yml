name: Research
description: Investigate a question and record an evidence-based finding
title: "[Research] "
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What uncertainty are you trying to resolve?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: What decision or work will this inform?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Expected output
      description: What will exist when the investigation is complete?
      placeholder: Compare three options and recommend one with supporting evidence.
    validations:
      required: true
  - type: textarea
    id: definition
    attributes:
      label: Definition of Done
      description: What evidence is enough to answer the question, or establish its limits?
    validations:
      required: true
  - type: input
    id: goal
    attributes:
      label: Goal ID
      description: Optional link to a broader goal.
  - type: textarea
    id: findings
    attributes:
      label: Findings / Sources
      description: Add initial evidence now; update with findings, uncertainties, and sources as you investigate.
